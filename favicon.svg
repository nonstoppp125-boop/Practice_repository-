<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background tile. Change the fill colour to alter the base shade. -->
  <rect width="64" height="64" rx="14" fill="#070d1a"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Three faces of an isometric cube. Top, left and right fills are the shading colours. -->
  <path d="M32 10 L50 20 L32 31 L14 20 Z" fill="#0e4a5c"/>
  <path d="M14 20 L32 31 L32 52 L14 42 Z" fill="#0b2540"/>
  <path d="M50 20 L32 31 L32 52 L50 42 Z" fill="#2a1f6b"/>

  <!-- Cube outline and inner edges. Change the stroke colour for a different neon accent. -->
  <path d="M32 10 L50 20 L50 42 L32 52 L14 42 L14 20 Z" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M14 20 L32 31 L50 20 M32 31 L32 52" fill="none" stroke="#22d3ee" stroke-opacity="0.6" stroke-width="2" stroke-linejoin="round"/>

  <!-- Rising chart line with arrow head. Edit the points to change the trend shape. -->
  <path d="M21 41 L29 33 L35 38 L46 24" fill="none" stroke="#e0f7ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M39 24 L46 24 L46 31" fill="none" stroke="#e0f7ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
